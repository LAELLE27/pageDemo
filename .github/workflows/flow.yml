name: test react app
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: code
        uses: actions/checkout@v3
      - name: install node v 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: install 
        run: npm install
      - name: test
        run: npm run test
 