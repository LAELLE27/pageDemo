name: test react app

permissions:
  contents: write
on: 
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: code
        uses: actions/checkout@v3
      - name: install node v 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: install 
        run: npm install
      - name: build
        run: npm run build
      - name: deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build

 